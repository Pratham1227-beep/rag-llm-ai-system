[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-llm-ai-system"
version = "0.1.0"
description = "Enterprise RAG + LLM AI System with OKF Knowledge Layer & Ollama Integration"
authors = [
    { name = "Pratham Khatri", email = "pratham@example.com" }
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "pypdf>=4.1.0",
    "sentence-transformers>=2.5.0",
    "chromadb>=0.4.24",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]

[tool.setuptools]
packages = ["app"]
